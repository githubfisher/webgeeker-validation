name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # PHP 5.6 / 7.0 / 7.1 对应 phpunit ^5.7 / ^6.5 / ^7.5
          - php: '5.6'
            phpunit: '^5.7'
          - php: '7.0'
            phpunit: '^6.5'
          - php: '7.1'
            phpunit: '^7.5'
          - php: '7.2'
            phpunit: '^8.5'
          - php: '7.3'
            phpunit: '^8.5'
          - php: '7.4'
            phpunit: '^9.6'
          - php: '8.0'
            phpunit: '^9.6'
          - php: '8.1'
            phpunit: '^9.6'
          - php: '8.2'
            phpunit: '^9.6'
          - php: '8.3'
            phpunit: '^9.6'
          - php: '8.4'
            phpunit: '^9.6'
          - php: '8.5'
            phpunit: '^9.6'

    name: PHP ${{ matrix.php }} / phpunit ${{ matrix.phpunit }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit
